<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑市成交錄</title>
<style>:root{color-scheme:dark}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#000000;color:#f5f5f5}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#000000;
    --surface:#1a1a1a;
    --surface-2:#3a3a3a;
    --item-bg:#2b2b2b;
    --border:#4a4a4a;
    --text:#f5f5f5;
    --text-dim:#d4d4d8;
    --text-faint:#a3a3a8;
    --accent:#a87ee6;
    --accent-strong:#d4b8f5;
    --accent-bg:#3a2f5c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background-color:var(--bg);
    background-image:url('image/25-Rnew.png');
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:var(--text);
    font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ text-wrap:balance; margin:0; font-family:'Noto Serif TC','PMingLiU',serif; }

  .page-nav{
    position:fixed; left:0; top:0; bottom:0; width:min(240px,82vw); z-index:30;
    background:color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter:blur(10px);
    border-right:1px solid var(--border);
    padding:60px 14px 20px; overflow-y:auto;
    display:flex; flex-direction:column; gap:4px;
    transform:translateX(-100%);
    transition:transform .25s ease;
    box-shadow:16px 0 32px -16px rgba(0,0,0,.7);
  }
  .page-nav.open{ transform:translateX(0); }
  .page-nav-title{
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-faint); font-weight:700; padding:0 12px 10px;
  }
  .page-nav .page-link{
    display:block; padding:9px 12px; border-radius:8px;
    color:var(--text-dim); text-decoration:none; font-size:.86rem;
    font-weight:600; cursor:pointer; white-space:nowrap;
    transition:background-color .15s ease, color .15s ease;
  }
  .page-nav .page-link:hover{ background:var(--surface-2); color:var(--text); }
  .page-nav .page-link.active{ background:var(--accent-bg); color:var(--accent-strong); }
  .page-nav .page-divider{ height:1px; background:var(--border); margin:8px 4px; }

  .page-nav-toggle{
    position:fixed; left:0; top:14px; z-index:31;
    display:flex; align-items:center; gap:7px;
    padding:10px 16px 10px 12px; border-radius:0 999px 999px 0;
    background:var(--surface-2); border:1px solid var(--border); border-left:none;
    color:var(--text-dim); font:inherit; font-size:.8rem; font-weight:700;
    letter-spacing:.02em; cursor:pointer; box-shadow:var(--shadow);
    transition:left .25s ease, background-color .15s ease, color .15s ease;
  }
  .page-nav-toggle:hover{ background:var(--accent-bg); color:var(--accent-strong); }
  .page-nav-toggle .arrow{
    flex:none; width:8px; height:8px;
    border-right:2px solid currentColor; border-bottom:2px solid currentColor;
    transform:rotate(-45deg); transition:transform .25s ease;
  }
  .page-nav-toggle #pageNavLabel{
    max-width:min(46vw,180px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .page-nav.open + .page-nav-toggle{ left:min(240px,82vw); }
  .page-nav.open + .page-nav-toggle .arrow{ transform:rotate(135deg); }

  .page-nav-backdrop{
    position:fixed; inset:0; z-index:29;
    background:rgba(0,0,0,.45);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .page-nav-backdrop.show{ opacity:1; pointer-events:auto; }

  .topbar{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
    padding:18px 20px;
  }
  .topbar-inner{
    max-width:920px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px;
  }
  .title-block{ display:flex; flex-direction:column; gap:4px; min-width:220px; }
  .eyebrow{
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .title-block h1{ font-size:1.55rem; font-weight:900; color:var(--text); }
  .title-block p{ margin:0; font-size:.85rem; color:var(--text-dim); }

  .lookup{ position:relative; flex:1; min-width:200px; max-width:280px; }
  .lookup svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); pointer-events:none; }
  .lookup::after{
    content:""; position:absolute; right:13px; top:50%; width:8px; height:8px;
    border-right:2px solid var(--text-faint); border-bottom:2px solid var(--text-faint);
    transform:translateY(-70%) rotate(45deg); pointer-events:none;
  }
  #lookup{
    width:100%; padding:10px 34px 10px 34px;
    border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text);
    font:inherit; font-size:.86rem; appearance:none; -webkit-appearance:none;
  }
  #lookup:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    padding:6px 12px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border);
    min-width:60px;
  }
  .stat b{ font-size:1.02rem; font-variant-numeric:tabular-nums; font-family:'Noto Serif TC',serif; }
  .stat span{ font-size:.66rem; color:var(--text-dim); letter-spacing:.03em; }

  main{ max-width:920px; margin:0 auto; padding:24px 20px 80px; }

  details.tier{
    margin-bottom:14px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface); overflow:hidden;
  }
  details.tier[hidden]{ display:none; }
  summary.tier-head{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:12px; padding:14px 16px;
  }
  summary.tier-head::-webkit-details-marker{ display:none; }
  summary.tier-head:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .chevron{
    flex:none; width:9px; height:9px; border-right:2px solid var(--text-faint); border-bottom:2px solid var(--text-faint);
    transform:rotate(-45deg); transition:transform .18s ease; margin-right:2px;
  }
  details.tier[open] > summary.tier-head .chevron{ transform:rotate(45deg); }
  .tier-badge{
    flex:none; width:28px; height:28px; border-radius:50%;
    background:var(--accent-bg); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:.8rem;
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  summary.tier-head h2{ font-size:1.05rem; font-weight:700; color:var(--text); }
  summary.tier-head .tier-meta{ margin-left:auto; font-size:.76rem; color:var(--text-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }

  ul.list{ list-style:none; margin:0; padding:10px; display:flex; flex-direction:column; gap:8px; }
  li.row{
    padding:12px 14px; border:1px solid var(--border); border-radius:10px;
    background:var(--item-bg);
    display:flex; flex-direction:column; gap:6px;
    transition:background-color .3s ease;
  }
  li.row[hidden]{ display:none; }
  li.row.highlight{ background:var(--accent-bg); border-color:var(--accent); }

  .row-main{ display:flex; align-items:stretch; justify-content:space-between; gap:16px; }
  .row-name{ font-family:'Noto Serif TC',serif; font-weight:600; font-size:.95rem; padding-top:2px; }

  .price-table{
    flex:none; width:calc(15em + 4ch); white-space:nowrap;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch;
    gap:4px; min-height:2.6em;
    font-size:.86rem; font-variant-numeric:tabular-nums;
    border-left:1px solid var(--border); padding-left:14px;
  }
  .price-table.two-line{ justify-content:space-between; }
  .price-table .price-line{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; }
  .price-table .main{ display:flex; align-items:baseline; gap:6px; }
  .price-table .label{ text-align:left; color:var(--text-faint); }
  .price-table .value{ text-align:left; font-weight:700; }
  .price-table .value.min{ color:#7ee2a6; }
  .price-table .value.max{ color:#ff8a80; }
  .price-table .abbr{ text-align:right; color:var(--text-faint); font-size:.78rem; font-weight:400; }
  .price-table.empty{
    justify-content:center;
    font-style:italic; color:var(--text-faint); font-weight:400;
  }

  .hist{ min-height:1.1em; }
  .hist summary{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:4px;
    font-size:.72rem; color:var(--text-faint);
  }
  .hist summary::-webkit-details-marker{ display:none; }
  .hist summary::before{
    content:""; flex:none; width:5px; height:5px;
    border-right:1.5px solid var(--text-faint); border-bottom:1.5px solid var(--text-faint);
    transform:rotate(-45deg); transition:transform .15s ease;
  }
  .hist[open] > summary::before{ transform:rotate(45deg); }
  .hist[data-empty="true"] summary{ cursor:default; pointer-events:none; opacity:.55; }
  .hist[data-empty="true"] summary::before{ visibility:hidden; }
  .hist .chips{ margin-top:6px; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chips .k{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-right:2px; align-self:center; }
  .chip{
    position:relative;
    font-size:.72rem; padding:3px 9px; border-radius:999px;
    background:var(--chip-bg, var(--surface-2)); border:1px solid var(--chip-border, var(--border)); color:var(--chip-text, var(--text-dim));
    font-variant-numeric:tabular-nums; cursor:default;
  }
  .chip::after{
    content:attr(data-date);
    position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%) translateY(4px);
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    padding:4px 9px; border-radius:6px; font-size:.68rem; font-weight:600;
    white-space:nowrap; box-shadow:var(--shadow);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .15s ease, transform .15s ease; z-index:5;
  }
  .chip::before{
    content:""; position:absolute; bottom:calc(100% + 3px); left:50%; transform:translateX(-50%);
    border:4px solid transparent; border-top-color:var(--border);
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity .15s ease; z-index:5;
  }
  .chip:hover::after, .chip:focus-visible::after{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
  .chip:hover::before, .chip:focus-visible::before{ opacity:1; visibility:visible; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); display:none; }
  .empty-state.show{ display:block; }

  footer{
    max-width:920px; margin:0 auto; padding:0 20px 40px; color:var(--text-faint); font-size:.78rem; line-height:1.7;
  }
  footer .rule{ border:none; border-top:1px solid var(--border); margin:0 0 16px; }
  footer .disclaimer{ margin-top:12px; font-style:italic; }

  @media (max-width:520px){
    .topbar{ padding-left:min(50vw,190px); }
    .topbar-inner{ flex-direction:column; align-items:stretch; }
    .lookup{ max-width:none; }
  }

  .side-art{
    position:fixed; right:0; bottom:0; z-index:1;
    max-height:88vh; width:auto; pointer-events:none;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));
    opacity:0; transition:opacity .4s ease;
  }
  .side-art.loaded{ opacity:1; }
  @media (max-width:1280px){ .side-art{ display:none; } }

  .upload-trigger{
    position:fixed; left:14px; bottom:14px; z-index:32;
    padding:10px 16px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-dim); font:inherit; font-size:.78rem; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow);
    transition:background-color .15s ease, color .15s ease;
  }
  .upload-trigger:hover{ background:var(--accent-bg); color:var(--accent-strong); }

  /* 背景待設定：目前使用與站台一致的毛玻璃面板，之後可替換 background-image */
  .modal-overlay{
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55);
    opacity:0; transition:opacity .25s ease;
    padding:20px;
  }
  .modal-overlay.show{ opacity:1; }
  .modal-panel{
    width:100%; max-width:360px;
    background:color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px 20px;
    transform:translateY(24px); opacity:0;
    transition:transform .28s ease, opacity .28s ease;
    position:relative;
  }
  .modal-overlay.show .modal-panel{ transform:translateY(0); opacity:1; }
  .modal-panel.entry{ max-width:480px; }

  .modal-close{
    position:absolute; right:12px; top:12px;
    width:26px; height:26px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-dim); font-size:.9rem; line-height:1; cursor:pointer;
  }
  .modal-close:hover{ background:var(--accent-bg); color:var(--accent-strong); }

  .modal-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:1.05rem; margin-bottom:14px; }

  .password-row{ display:flex; gap:8px; }
  #passwordInput{
    flex:1; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--item-bg); color:var(--text); font:inherit; font-size:.9rem;
  }
  #passwordInput:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  #passwordConfirm{
    padding:10px 16px; border-radius:9px; border:1px solid var(--border);
    background:var(--accent-bg); color:var(--accent-strong); font:inherit; font-weight:700;
    cursor:pointer;
  }
  #passwordConfirm:hover{ filter:brightness(1.1); }
  .password-error{ margin-top:8px; font-size:.78rem; color:#ff8a80; min-height:1.1em; }

  .entry-date-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .entry-date-row label{ font-size:.84rem; color:var(--text-dim); }
  .entry-date-hint{ font-size:.72rem; color:var(--text-faint); }
  .date-picker{ position:relative; }
  #entryDate{
    width:11em; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--item-bg); color:var(--text); font:inherit; font-size:.85rem; cursor:pointer;
  }
  #entryDate:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .date-popover{
    position:absolute; left:0; top:calc(100% + 6px); z-index:50;
    width:240px; padding:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow);
  }
  .date-popover-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; font-size:.82rem; font-weight:700; color:var(--text);
  }
  .date-nav{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); cursor:pointer; font-size:.9rem; line-height:1;
  }
  .date-nav:hover{ background:var(--accent-bg); color:var(--accent-strong); }
  .date-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:.68rem; color:var(--text-faint); margin-bottom:4px;
  }
  .date-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .date-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:.78rem; font-variant-numeric:tabular-nums;
    color:var(--text-dim); background:transparent; border:1px solid transparent; cursor:pointer;
  }
  .date-cell:hover{ background:var(--accent-bg); color:var(--accent-strong); }
  .date-cell.blank{ visibility:hidden; cursor:default; }
  .date-cell.disabled{
    color:var(--text-faint); opacity:.35; cursor:not-allowed; pointer-events:none; background:transparent;
  }
  .date-cell.today{ border-color:var(--accent); }
  .date-cell.selected{ background:var(--accent-bg); color:var(--accent-strong); font-weight:700; }

  .entry-table{ width:100%; border-collapse:collapse; margin-bottom:14px; }
  .entry-table th{ font-size:.72rem; color:var(--text-faint); text-align:left; padding:0 6px 6px; font-weight:600; }
  .entry-table td{ padding:4px 6px; }
  .entry-idx{ width:1.6em; color:var(--text-faint); font-variant-numeric:tabular-nums; text-align:center; }
  .entry-item, .entry-ed{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--item-bg); color:var(--text); font:inherit; font-size:.82rem;
  }
  .entry-ed{ font-variant-numeric:tabular-nums; }

  .entry-actions{ display:flex; justify-content:flex-end; }
  #entrySubmit{
    padding:10px 22px; border-radius:9px; border:1px solid var(--border);
    background:var(--accent-bg); color:var(--accent-strong); font:inherit; font-weight:700;
    cursor:pointer;
  }
  #entrySubmit:hover{ filter:brightness(1.1); }
  #entrySubmit:disabled{ opacity:.6; cursor:default; }

  .entry-msg{ margin-top:10px; font-size:.78rem; min-height:1.1em; }
  .entry-msg.ok{ color:#7ee2a6; }
  .entry-msg.warn{ color:#e3c98f; }
  .entry-msg.error{ color:#ff8a80; }

  @media (max-width:520px){
    .modal-panel.entry{ padding:18px 14px; }
    .entry-table th:first-child, .entry-idx{ display:none; }
  }
</style>
</head><body>

<nav class="page-nav" id="pageNav">
  <div class="page-nav-title">頁面</div>
</nav>
<button type="button" class="page-nav-toggle" id="pageNavToggle" aria-label="展開頁面清單" aria-expanded="false"><span class="arrow"></span><span id="pageNavLabel">歷史成交總集</span></button>
<div class="page-nav-backdrop" id="pageNavBackdrop"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="title-block">
      <span class="eyebrow">黑暗精靈黑市 · 拍賣品資料庫</span>
      <h1>歷史成交總集</h1>
      <p>依層級整理的最低／最高成交參考價，單位 ED</p>
    </div>
    <div class="lookup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <select id="lookup"></select>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main id="main"></main>
<div class="empty-state" id="emptyState">找不到符合的拍賣品</div>

<footer>
  <hr class="rule">
  資料整理自 Sheet.xlsx →「歷史成交總集」工作表，欄位包含最低／最高價參考與各筆歷史成交紀錄。金額單位皆為 ED；標示「尚無成交紀錄」代表目前尚未有可參考的成交資料。點選右上角下拉選單可快速定位品項，點擊層級標題可展開／摺疊。
  <p class="disclaimer">該統計資料僅以已知資訊查看，僅提供觀看者參考，非絕對干涉黑暗精靈市場運作</p>
</footer>

<img class="side-art" id="sideArt" alt="">

<button type="button" class="upload-trigger" id="uploadTrigger">點我上傳成交結果</button>

<div class="modal-overlay" id="passwordOverlay" hidden>
  <div class="modal-panel password">
    <button type="button" class="modal-close" id="passwordClose" aria-label="關閉">×</button>
    <div class="modal-title">請輸入密碼</div>
    <div class="password-row">
      <input type="password" id="passwordInput" placeholder="密碼" autocomplete="off">
      <button type="button" id="passwordConfirm">確認</button>
    </div>
    <div class="password-error" id="passwordError"></div>
  </div>
</div>

<div class="modal-overlay" id="entryOverlay" hidden>
  <div class="modal-panel entry">
    <button type="button" class="modal-close" id="entryClose" aria-label="關閉">×</button>
    <div class="modal-title">上傳成交結果</div>
    <div class="entry-date-row">
      <label for="entryDate">日期</label>
      <div class="date-picker" id="datePicker">
        <input type="text" id="entryDate" readonly autocomplete="off" placeholder="選擇日期">
        <div class="date-popover" id="datePopover" hidden>
          <div class="date-popover-head">
            <button type="button" class="date-nav" id="datePrev" aria-label="上個月">‹</button>
            <span id="dateMonthLabel"></span>
            <button type="button" class="date-nav" id="dateNext" aria-label="下個月">›</button>

  const dateColorMap = {};

  function colorForDate(date){
    if(!dateColorMap[date]) dateColorMap[date] = DATE_PALETTE[dateColorIdx++ % DATE_PALETTE.length];
    return dateColorMap[date];
  }

  function fmtAbbrev(n){
    if(n >= 1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,'') + '億';
    if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.?0+$/,'') + '萬';
    return null;
  }

  function itemDates(item){
    if(!item.history.length) return [];
    const set = new Set();
    item.history.forEach((v, i) => set.add((item.historyDates && item.historyDates[i]) || SNAPSHOT_DATE));
    return Array.from(set);
  }

  function renderRow(item, tierIdx, itemIdx){
    const hasData = item.history.length > 0;
    const li = document.createElement('li');
    li.className = 'row';
    li.dataset.key = tierIdx + '-' + itemIdx;
    li.dataset.dates = itemDates(item).join(',');

    let priceTableHtml;
    if(hasData){
      const minAbbr = fmtAbbrev(item.min);
      const minRow = `<div class="price-line"><span class="main"><span class="label">最低</span><span class="value min">${item.min.toLocaleString()}</span></span>${minAbbr ? `<span class="abbr">(${minAbbr})</span>` : ''}</div>`;
      let maxRow = '';
      const hasMax = item.history.length > 1;
      if(hasMax){
        const maxAbbr = fmtAbbrev(item.max);
        maxRow = `<div class="price-line"><span class="main"><span class="label">最高</span><span class="value max">${item.max.toLocaleString()}</span></span>${maxAbbr ? `<span class="abbr">(${maxAbbr})</span>` : ''}</div>`;
      }
      priceTableHtml = `<div class="price-table${hasMax ? ' two-line' : ''}">${maxRow}${minRow}</div>`;
    } else {
      priceTableHtml = `<div class="price-table empty"><span>尚無成交紀錄</span></div>`;
    }

    const historyHtml = item.history.length
      ? `<details class="hist"><summary>成交紀錄・${item.history.length}筆</summary><div class="chips">${item.history.map((v, i) => {
          const date = (item.historyDates && item.historyDates[i]) || SNAPSHOT_DATE;
          const c = colorForDate(date);
          return `<span class="chip" tabindex="0" data-date="參考日期：${date}" style="--chip-bg:${c.bg};--chip-border:${c.border};--chip-text:${c.text}">${v.toLocaleString()}</span>`;
        }).join('')}</div></details>`
      : `<details class="hist" data-empty="true"><summary>無歷史紀錄</summary></details>`;

    li.innerHTML = `<div class="row-main"><div class="row-name">${item.name}</div>${priceTableHtml}</div>${historyHtml}`;
    return li;
  }

  function render(){
    const main = document.getElementById('main');
    const lookup = document.getElementById('lookup');

    let opts = '<option value="">全部拍賣品</option>';
    let totalItems = 0, withData = 0, noData = 0;
    const allDates = new Set();

    DATA.forEach((tier, tierIdx) => {
      totalItems += tier.items.length;
      tier.items.forEach(it => {
        (it.history.length > 0 || it.max > 0) ? withData++ : noData++;
        itemDates(it).forEach(d => allDates.add(d));
      });

      const details = document.createElement('details');
      details.className = 'tier';
      details.open = true;
      details.dataset.tier = tierIdx;
      details.innerHTML = `<summary class="tier-head">
        <span class="chevron"></span>
        <span class="tier-badge">${ROMAN[tier.name] || ''}</span>
        <h2>${tier.name}</h2>

      ul.className = 'list';

        ul.appendChild(renderRow(it, tierIdx, itemIdx));
        opts += `<option value="${tierIdx}-${itemIdx}">${tier.name}・${it.name}</option>`;
      });
      details.appendChild(ul);
      main.appendChild(details);
    });

    lookup.innerHTML = opts;
    renderPageNav(allDates);
    updateToggleLabel();

    document.getElementById('stats').innerHTML = `
      <div class="stat"><b>${totalItems}</b><span>總拍賣品</span></div>

      <div class="stat"><b>${noData}</b><span>尚無紀錄</span></div>
    `;
  }

  function renderPageNav(dateSet){
    const nav = document.getElementById('pageNav');
    const dates = Array.from(dateSet).sort().reverse();
    let html = '<div class="page-nav-title">頁面</div>';
    html += '<a class="page-link active" data-date="">歷史成交總集</a>';
    html += '<div class="page-divider"></div>';
    html += dates.map(d => `<a class="page-link" data-date="${d}">${d}成交紀錄</a>`).join('');
    nav.innerHTML = html;
  }

  function updateToggleLabel(){
    const active = document.querySelector('.page-link.active');
    const label = document.getElementById('pageNavLabel');
    if(active && label) label.textContent = active.textContent;
  }

  function filterByDate(date){
    document.getElementById('lookup').value = '';
    document.querySelectorAll('.page-link').forEach(a => a.classList.toggle('active', a.dataset.date === date));
    updateToggleLabel();
    const emptyState = document.getElementById('emptyState');
    document.querySelectorAll('li.row').forEach(li => li.classList.remove('highlight'));

    if(!date){
      document.querySelectorAll('details.tier').forEach(d => { d.hidden = false; d.open = true; });
      document.querySelectorAll('li.row').forEach(li => li.hidden = false);
      emptyState.classList.remove('show');
      return;
    }

    let anyVisible = false;
    document.querySelectorAll('details.tier').forEach(tier => {
      let tierHasVisible = false;
      tier.querySelectorAll('li.row').forEach(li => {
        const dates = li.dataset.dates ? li.dataset.dates.split(',') : [];
        const match = dates.includes(date);
        li.hidden = !match;
        if(match){ tierHasVisible = true; anyVisible = true; }
      });
      tier.hidden = !tierHasVisible;
      tier.open = tierHasVisible;
    });
    emptyState.classList.toggle('show', !anyVisible);
  }

  function goToItem(key){
    const emptyState = document.getElementById('emptyState');
    document.querySelectorAll('li.row').forEach(li => li.classList.remove('highlight'));
    document.querySelectorAll('.page-link').forEach(a => a.classList.toggle('active', a.dataset.date === ''));
    updateToggleLabel();

    if(!key){
      document.querySelectorAll('details.tier').forEach(d => { d.hidden = false; d.open = true; });
      document.querySelectorAll('li.row').forEach(li => li.hidden = false);
      emptyState.classList.remove('show');
      return;
    }

    const target = document.querySelector(`li.row[data-key="${key}"]`);
    if(!target){ emptyState.classList.add('show'); return; }
    emptyState.classList.remove('show');

    document.querySelectorAll('details.tier').forEach(d => d.hidden = true);
    const parentDetails = target.closest('details.tier');
    parentDetails.hidden = false;
    parentDetails.open = true;
    parentDetails.querySelectorAll('li.row').forEach(li => li.hidden = true);
    target.hidden = false;
    target.classList.add('highlight');
    target.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function todayStr(){
    return fmtDate(new Date());
  }

  function fmtDate(d){
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // 只開放週三(3)、週六(6)可選
  const ALLOWED_DAYS = [3, 6];
  function nearestAllowedDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    while(!ALLOWED_DAYS.includes(d.getDay())) d.setDate(d.getDate() + 1);
    return fmtDate(d);
  }

  const datePicker = document.getElementById('datePicker');

  const dateNext = document.getElementById('dateNext');
  let calendarViewDate = new Date();

  function renderCalendar(){
    const year = calendarViewDate.getFullYear();
    const month = calendarViewDate.getMonth();
    dateMonthLabel.textContent = `${year}年${month + 1}月`;

    const startWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const selected = entryDate.value;
    const todayIso = todayStr();

    let html = '';
    for(let i = 0; i < startWeekday; i++) html += '<span class="date-cell blank"></span>';
    for(let day = 1; day <= daysInMonth; day++){
      const cellDate = new Date(year, month, day);
      const iso = fmtDate(cellDate);
      const cls = ['date-cell'];
      if(!ALLOWED_DAYS.includes(cellDate.getDay())) cls.push('disabled');
      if(iso === todayIso) cls.push('today');
      if(iso === selected) cls.push('selected');
      html += `<span class="${cls.join(' ')}" data-date="${iso}">${day}</span>`;
    }
    dateGrid.innerHTML = html;
  }

    const base = entryDate.value || nearestAllowedDate(todayStr());

      html += `<optgroup label="${tier.name}">`;
      tier.items.forEach((it, itemIdx) => {
        html += `<option value="${tierIdx}-${itemIdx}">${it.name}</option>`;
      });
      html += '</optgroup>';
    });
    return html;
  }

  function buildEntryRows(){
    const optionsHtml = buildItemOptions();
    entryRows.innerHTML = [1, 2, 3, 4].map(n => `
      <tr>
        <td class="entry-idx">${n}</td>
        <td><select class="entry-item">${optionsHtml}</select></td>
        <td><input type="number" class="entry-ed" min="0" step="1" placeholder="ED"></td>
      </tr>
    `).join('');
  }

  function openEntryModal(){
    buildEntryRows();
    entryDate.value = nearestAllowedDate(todayStr());
    entryMsg.textContent = '';
    entryMsg.className = 'entry-msg';
    openOverlay(entryOverlay);
  }

  async function ensureFileHandle(){
    if(fileHandle) return fileHandle;
    if(!window.showOpenFilePicker) return null;
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }],
        excludeAcceptAllOption: false,
        multiple: false,
      });
      let perm = await handle.queryPermission({ mode: 'readwrite' });
      if(perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
      if(perm !== 'granted') return null;
      fileHandle = handle;
      return fileHandle;
    }catch(err){
      return null;
    }
  }

  async function submitEntries(){
    const date = entryDate.value || todayStr();
    const rows = Array.from(entryRows.querySelectorAll('tr')).map(tr => ({
      key: tr.querySelector('.entry-item').value,
      ed: tr.querySelector('.entry-ed').value,
    })).filter(r => r.key && r.ed !== '' && Number(r.ed) > 0);

    if(!rows.length){
      entryMsg.textContent = '請至少填寫一筆成交紀錄';
      entryMsg.className = 'entry-msg error';
      return;
    }

    entrySubmit.disabled = true;
    entryMsg.textContent = '處理中…';
    entryMsg.className = 'entry-msg';

    try{
      const handle = await ensureFileHandle();
      if(!handle){
        const text = rows.map(r => {
          const [t, i] = r.key.split('-').map(Number);
          return `${date}\t${DATA[t].items[i].name}\t${r.ed}`;
        }).join('\n');
        await navigator.clipboard.writeText(text);
        entryMsg.textContent = '此瀏覽器不支援直接寫入檔案，已複製文字到剪貼簿，請手動貼到 sheet.html';
        entryMsg.className = 'entry-msg warn';
        entrySubmit.disabled = false;
        return;
      }

      const file = await handle.getFile();
      const text = await file.text();
      const match = text.match(/const DATA = (\[[\s\S]*?\]);/);
      if(!match) throw new Error('在檔案中找不到 DATA 陣列');
      const fileData = JSON.parse(match[1]);

      rows.forEach(r => {
        const [t, i] = r.key.split('-').map(Number);
        const item = fileData[t].items[i];
        if(!Array.isArray(item.historyDates) || item.historyDates.length !== item.history.length){
          item.historyDates = item.history.map(() => SNAPSHOT_DATE);
        }
        item.history.push(Number(r.ed));
        item.historyDates.push(date);
        item.min = Math.min(...item.history);
        item.max = Math.max(...item.history);
      });

      const newText = text.slice(0, match.index) + `const DATA = ${JSON.stringify(fileData)};` + text.slice(match.index + match[0].length);
      const writable = await handle.createWritable();
      await writable.write(newText);
      await writable.close();

      rows.forEach(r => {
        const [t, i] = r.key.split('-').map(Number);
        DATA[t].items[i] = fileData[t].items[i];
      });
      render();

      entryMsg.textContent = '已更新並寫入 sheet.html！';
      entryMsg.className = 'entry-msg ok';
      setTimeout(() => closeOverlay(entryOverlay), 900);
    }catch(err){
      entryMsg.textContent = '寫入失敗：' + err.message;
      entryMsg.className = 'entry-msg error';
    }finally{
      entrySubmit.disabled = false;
    }
  }

  uploadTrigger.addEventListener('click', handleUploadTrigger);
  passwordConfirm.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keydown', e => { if(e.key === 'Enter') checkPassword(); });
  passwordClose.addEventListener('click', () => closeOverlay(passwordOverlay));
  entryClose.addEventListener('click', () => closeOverlay(entryOverlay));
  entrySubmit.addEventListener('click', submitEntries);
  entryDate.addEventListener('click', () => {
    if(datePopover.hidden) openDatePopover(); else closeDatePopover();
  });
  datePrev.addEventListener('click', () => {
    calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
    renderCalendar();
  });
  dateNext.addEventListener('click', () => {
    calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
    renderCalendar();
  });
  dateGrid.addEventListener('click', e => {
    const cell = e.target.closest('.date-cell');
    if(!cell || cell.classList.contains('disabled') || cell.classList.contains('blank')) return;
    entryDate.value = cell.dataset.date;
    closeDatePopover();
  });
  document.addEventListener('click', e => {
    if(!datePopover.hidden && !datePicker.contains(e.target)) closeDatePopover();
  });
  [passwordOverlay, entryOverlay].forEach(overlay => {
    overlay.addEventListener('click', e => { if(e.target === overlay) closeOverlay(overlay); });
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(passwordOverlay.classList.contains('show')) closeOverlay(passwordOverlay);
    if(entryOverlay.classList.contains('show')) closeOverlay(entryOverlay);
  });
</script>

</body></html>
